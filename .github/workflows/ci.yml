name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,viz]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest --cov=vibecheck

  # The core is numpy-only: it must import and pass its tests without the viz
  # extra, and importing the package must not pull in matplotlib.
  test-no-viz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (no viz)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Core stays numpy-only
        run: python -c "import sys, vibecheck; assert 'matplotlib' not in sys.modules"
      - name: Test
        run: pytest

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
      - name: Check
        run: twine check dist/*
      - name: Sdist excludes internal files
        run: |
          contents=$(tar -tzf dist/*.tar.gz)
          echo "$contents"
          for forbidden in proposal CLAUDE.md GOAL.md report.html; do
            if echo "$contents" | grep -qF "$forbidden"; then
              echo "sdist contains forbidden entry: $forbidden" >&2
              exit 1
            fi
          done
