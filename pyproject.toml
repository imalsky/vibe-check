[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vibe-check"
version = "0.1.0"
description = "Reliability checks for machine-learning surrogates in scientific software."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Isaac Malsky", email = "isaacmalsky@gmail.com" }]
keywords = [
  "machine-learning", "surrogate", "emulator", "neural-operator",
  "validation", "reliability", "scientific-computing", "reproducibility",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy>=1.24",
]

[project.optional-dependencies]
viz = ["matplotlib>=3.7"]
dev = ["pytest>=7.4", "ruff>=0.5", "pytest-cov>=4.1"]

[project.urls]
Homepage = "https://github.com/imalsky/vibe-check"
Repository = "https://github.com/imalsky/vibe-check"

[tool.hatch.build.targets.wheel]
packages = ["src/vibecheck"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
